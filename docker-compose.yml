services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: contabilidade
      POSTGRES_USER: contabilidade
      POSTGRES_PASSWORD: contabilidade
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contabilidade"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://db:5432/contabilidade
      DB_USER: contabilidade
      DB_PASSWORD: contabilidade
      JWT_SECRET: troque-esta-chave-em-producao-minimo-32-bytes!!
      SEED_USUARIOS: "true"
    ports: ["8080:8080"]

volumes:
  pgdata:
